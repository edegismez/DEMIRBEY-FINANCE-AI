const kmhEntered=()=>BANKACC.some(x=>x.kmh!=null);
const kmhNote=def=>kmhEntered()?(kmhFree()>=def?`<br><span style="color:var(--yesil)">✓ Boş KMH limiti ${fmt(kmhFree())} – bu açık KMH ile karşılanabilir (faiz maliyetine dikkat).</span>`:`<br><b>✗ Boş KMH limiti ${fmt(kmhFree())} – açığı karşılamaya yetmiyor, ${fmt(def-kmhFree())} ek kaynak gerekir.</b>`):`<br><span class="sub">Banka bazında KMH limitlerini <a onclick="go('banka')" style="cursor:pointer;text-decoration:underline">Bankalar & Limitler</a> ekranına girerseniz açığın KMH ile karşılanıp karşılanmadığı burada yazar.</span>`;
const dmy=s=>{const [d,m,y]=s.split('.').map(Number);return offOf(new Date(y,m-1,d));};
const isIn=e=>e.kind==='cek_t';
const ticari=EV.filter(e=>e.scope==='ticari');
function flow(days){
 let bal=OPENING,min=null,rows=[];
 for(let d=0;d<=days;d++){
  const ev=ticari.filter(e=>e.off===d);
  const inn=ev.filter(isIn).reduce((a,e)=>a+e.amt,0),out=ev.filter(e=>!isIn(e)).reduce((a,e)=>a+e.amt,0);
  bal+=inn-out;rows.push({d,inn,out,bal,ev});
  if(bal<0&&!min)min={d,bal};
 }
 return {rows,min};
}

function monthData(mo){
 const y=TODAY.getFullYear(),m=TODAY.getMonth()+mo,first=new Date(y,m,1),last=new Date(y,m+1,0),a=offOf(first),b=offOf(last);

 const ist=CHEQUES.filter(c=>(c.cat==='turuncu'||c.cat==='mavi')&&c.off>=a&&c.off<=b).sort((x,z)=>x.off-z.off);
 // ayı kesen pazartesi–pazar haftaları
 const weeks=[];let d=new Date(first);d.setDate(d.getDate()-((d.getDay()+6)%7));
 while(d<=last){const ws=new Date(d),we=new Date(d);we.setDate(we.getDate()+6);weeks.push([Math.max(offOf(ws),a),Math.min(offOf(we),b)]);d.setDate(d.getDate()+7);}

function overdue(name,rate){
 const s=SALES[name]||{inv:[],col:[]},daily=rate/100/30;
 const pool=s.col.filter(c=>c[0]<=0).slice().sort((a,b)=>a[0]-b[0]).map(c=>({d:c[0],left:c[1],desc:c[2]}));let k=0;
 return s.inv.map(([no,d,amt,term])=>({no,d,amt,term,due:d+term})).sort((a,b)=>a.due-b.due).map(f=>{
  let open=f.amt,int=0,last=null;const h=[[f.d,`Fatura kesildi: ${fmt(f.amt)}, vade ${f.term} gün → son ödeme ${ds(f.due)}.`]];
  while(open>0&&k<pool.length){const c=pool[k],u=Math.min(c.left,open);open-=u;c.left-=u;if(!c.left)k++;
   const late=Math.max(0,c.d-f.due);int+=u*daily*late;last=c.d;
   h.push([c.d,`${c.desc}: ${fmt(u)} bu faturaya mahsup edildi${late?` (${late} gün gecikmeli)`:' (vadesinde)'}.${open>0?' Kalan '+fmt(open)+'.':' Fatura kapandı.'}`]);}
  const days=open>0?Math.max(0,-f.due):Math.max(0,(last??f.due)-f.due);
  if(open>0){int+=open*daily*days;if(f.due<0)h.push([f.due,`Vade doldu; ${fmt(open)} tahsil edilmeden kaldı.`]);if(days)h.push([0,`Bugün itibarıyla ${days} gün gecikmede, açık tutar ${fmt(open)}.`]);}
  return {...f,open,days,int,h:h.sort((a,b)=>a[0]-b[0])};
 });
}

function parseColonEvent(t){
 const parts=t.split(':').map(x=>x.trim()).filter(Boolean);if(parts.length<3)return null;
 const type=up(parts[0]);let bank=null,amt=0,no=null,firm=[];
 for(let i=1;i<parts.length;i++){const x=parts[i];
  if(/^ÇKN\.?$|^ÇEK NO\.?$/i.test(up(x))){no=(parts[i+1]||'').replace(/\D/g,'')||null;i++;continue;}
  const ck=up(x).match(/^(?:ÇKN|ÇEK NO)\.?\s*(\d+)/);if(ck){no=ck[1];continue;}
  const m=x.match(/^(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:,\d{1,2})?)\s*(TL|₺)?$/i);if(m){amt=+m[1].replace(/\./g,'').replace(',','.');continue;}
  if(!bank&&bankOf(x)){bank=bankOf(x);continue;}firm.push(x);}
 const tah=/TAHS/.test(type),kind=/ÇEK/.test(type)?(tah?'cek_t':'cek_o'):tah?'cek_t':/KART/.test(type)?(/ŞAHS/.test(type)?'kk_s':'kk_t'):/KREDİ|TAKSİT|KMH/.test(type)?'kredi':'diger';
 const f=firm.join(' ').replace(/\s+/g,' ');
 return {kind,amt,scope:kind==='kk_s'?'sahsi':'ticari',bank,firm:f,no,lbl:[f,bank,no?'Çek '+no:null].filter(Boolean).join(' · ')||t,src:'takvim'};
}
function parseCalEvent(g){

 const c=parseColonEvent(t);if(c)return {off:g.off,...c};
 const m=t.match(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d{4,}(?:,\d{1,2})?)/);const amt=m?+m[1].replace(/\./g,'').replace(',','.'):0;
 const kind=/çek/i.test(t)?'cek_o':/kredi kart|kart|ekstre/i.test(t)?(/şahsi|bonus|axess|world|maximum/i.test(t)&&!/ticari/i.test(t)?'kk_s':'kk_t'):/kredi|taksit|kmh/i.test(t)?'kredi':'diger';
 return {off:g.off,kind,amt,scope:kind==='kk_s'?'sahsi':'ticari',lbl:t.replace(/\s*[\d.,]+\s*(TL)?\s*$/i,'').trim()||t,src:'takvim'};

function gPush(){ // uygulama → takvim

 GCAL.filter(g=>!g.key&&!g.imported&&!g.ignored&&g.off>=0&&!calHasApp(g)).forEach(g=>{const e=parseCalEvent(g);if(!e){g.ignored='ödeme değil';return;}

}

const loanMarks=new Set(); // kullanıcının "ödendi" beyanı (banka kaydıyla doğrulanacak)
const addM=(off,m)=>{const d=dt(off);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return offOf(d);};
function schedule(l){
 if(l.rows)return l.rows.map((r,i)=>{const key=l.bank+'|'+l.type+'|'+(i+1);return {n:i+1,off:r.off,amt:r.amt,principal:r.principal,interest:r.interest,tax:r.tax,rem:r.rem,key,st:r.paid?'paid':loanMarks.has(key)?'declared':r.off<0?'late':'due'};});
 const paidN=l.total-l.left,rows=[];
 for(let n=1;n<=l.total;n++){const off=addM(l.off,n-paidN-1),key=l.bank+'|'+l.type+'|'+n;
  const st=n<=paidN?'paid':loanMarks.has(key)?'declared':off<0?'late':'due';rows.push({n,off,amt:l.inst,st,key});}
 return rows;
}

const loadScript=src=>new Promise((ok,err)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>err(new Error('Kütüphane yüklenemedi (internet bağlantısını kontrol edin).'));document.head.appendChild(s);});
async function pdfjs(){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';return pdfjsLib;}
// PDF → sayfa sayfa satırlar (hücreler " | " ile) + istenirse logo imzaları (yukarıdan aşağı)
async function pdfPages(buf,withLogos){const L=await pdfjs(),doc=await L.getDocument({data:buf}).promise,pages=[];
 for(let p=1;p<=doc.numPages;p++){const page=await doc.getPage(p),tc=await page.getTextContent(),rows=new Map();
  tc.items.forEach(it=>{if(!it.str.trim())return;const y=Math.round(it.transform[5]/3)*3;(rows.get(y)||rows.set(y,[]).get(y)).push([it.transform[4],it.str.trim()]);});
  const lines=[...rows.entries()].sort((a,b)=>b[0]-a[0]).map(([,a])=>a.sort((x,z)=>x[0]-z[0]).map(x=>x[1]).join(' | '));
  let logos=[];if(withLogos&&lines.some(l=>/^Limit \/ Risk Tablosu$/.test(l))&&!lines.some(l=>/Risk Tablosu - Toplam/.test(l))){logos=await pageLogos(L,page);}
  pages.push({lines,logos});}
 return pages;}
async function pageLogos(L,page){const vp=page.getViewport({scale:0.3}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
 await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;const ops=await page.getOperatorList(),O=L.OPS;let ctm=[1,0,0,1,0,0];const st=[],out=[];
 for(let i=0;i<ops.fnArray.length;i++){const f=ops.fnArray[i],a=ops.argsArray[i];
  if(f===O.save)st.push(ctm.slice());else if(f===O.restore)ctm=st.pop()||ctm;
  else if(f===O.transform){const [a1,b1,c1,d1,e1,f1]=a,[A,B,C,D,E,F]=ctm;ctm=[A*a1+C*b1,B*a1+D*b1,A*c1+C*d1,B*c1+D*d1,A*e1+C*f1+E,B*e1+D*f1+F];}
  else if(f===O.paintImageXObject&&page.objs.has(a[0])){const o=page.objs.get(a[0]);if(o&&o.width>2.5*o.height&&o.width>100)out.push({y:ctm[5],sig:imgSig(o)});}}
 return out.sort((x,z)=>z.y-x.y).map(x=>x.sig);}
function imgSig(o){const c=document.createElement('canvas');c.width=32;c.height=8;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,32,8);

// Tablo satırlarında kelimeler sayfadaki x konumuna göre sütunlara yerleştirilir; okunamayan hücre boş kalır, sütunlar kaymaz.
async function ocrPdf(buf,prog){await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');const L=await pdfjs(),doc=await L.getDocument({data:buf}).promise;
 const wk=await Tesseract.createWorker('tur',1,{logger:m=>{if(m.status==='recognizing text'&&prog)prog(Math.round(m.progress*100));}});
 await wk.setParameters({tessedit_pageseg_mode:'4',preserve_interword_spaces:'1'});const rows=[];
 try{for(let p=1;p<=doc.numPages;p++){prog&&prog(0,p,doc.numPages);const pg=await doc.getPage(p),vp=pg.getViewport({scale:3}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const {data}=await wk.recognize(c);
  const lines=(data.lines||[]).map(l=>({text:l.text.trim(),words:(l.words||[]).filter(w=>w.text.trim()).map(w=>({t:w.text.trim(),x:(w.bbox.x0+w.bbox.x1)/2}))}));
  const tab=lines.filter(l=>/\d{1,2}[./]\d{1,2}[./]\d{2,4}/.test(l.text)&&l.words.filter(w=>/^\d[\d.]*,\d{2}$/.test(w.t)).length>=3); // tarih + en az 3 tutar
  const ref=tab.reduce((a,l)=>l.words.length>a.length?l.words:a,[]);const anchors=ref.map(w=>w.x);
  lines.forEach(l=>{if(tab.includes(l)&&anchors.length){const cells=Array(anchors.length).fill('');l.words.forEach(w=>{let k=0,b=1e9;anchors.forEach((a,i)=>{const d=Math.abs(a-w.x);if(d<b){b=d;k=i;}});cells[k]=cells[k]?cells[k]+' '+w.t:w.t;});rows.push(cells);}
   else if(l.text)rows.push(l.text.split(/\s{2,}/));});}}
 finally{await wk.terminate();}return rows;}

 return `DEMİRBEY FINANCE AI\n\n📊 HAFTALIK FİNANS RAPORU\n${ds(a)} – ${ds(b)}\n\n🔴 Ödenecek çekler: ${fmt(co)}\n🟢 Beklenen çek tahsilatları: ${fmt(ct)}\n🟣 Kredi taksitleri: ${fmt(kr)}\n🔵 Ticari kredi kartları: ${fmt(kt)}\n💳 Şahsi kredi kartları: ${fmt(ks)}\n🟠 Diğer planlı ödemeler: ${fmt(dg)}\n\nTicari toplam ödeme: ${fmt(tp)}\nŞahsi toplam ödeme: ${fmt(ps)}\nBeklenen ticari tahsilat: ${fmt(ct)}\nTahmini ticari net nakit hareketi: ${fmt(ct-tp)}\n\n— GÜNLÜK DAĞILIM —${daily}\n\n(Şahsi ödemeler ticari nakit akışına eklenmemiştir.)`;

/* ---- AI ---- */
const chatLog=[{a:1,t:'Merhaba! Çek, kart, kredi, nakit ve ürün verilerinizi sorgulayabilirsiniz. Örn: "Bu hafta hangi çekleri ödeyeceğim?"',s:''}];
function answer(q){
 q=q.toLocaleLowerCase('tr');
 const rng=q.includes('yarın')?[1,1]:q.includes('bu hafta')||q.includes('gelecek hafta')?(q.includes('gelecek')?[7,13]:[0,6]):[0,29];
 if(role!=='sahsi'&&q.includes('çek')){
  const col=q.includes('tahsil')||q.includes('geliyor');
  const l=CHEQUES.filter(c=>c.off>=rng[0]&&c.off<=rng[1]&&c.cat===(col?'yesil':'kirmizi'));
  if(!l.length)return ['Seçili dönemde kayıt bulunamadı.','Kaynak: Logo GO 3 · Çek portföyü'];
  return [`${col?'Tahsilata gelen':'Ödenecek'} çekler (toplam ${fmt(l.reduce((a,c)=>a+c.amt,0))}):\n`+l.map(c=>`• ${ds(c.off)} – ${c.firm} / ${c.bank} – ${fmt(c.amt)}`).join('\n'),`Kaynak: Logo GO 3 · Çek hareketleri (${l.length} kayıt)`];
 }
 if(q.includes('yarın')&&role!=='sahsi'){
  const e=ticari.filter(x=>x.off===1&&!isIn(x));if(!e.length)return ['Yarın için planlı ticari ödeme görünmüyor.','Kaynak: ödeme takvimi'];
  return ['Yarın toplam '+fmt(e.reduce((a,x)=>a+x.amt,0))+' ticari ödeme var.','Kaynak: ödeme takvimi'];
 }
 if(q.includes('şahsi')){
  if(role!=='admin'&&role!=='sahsi')return ['Şahsi finans verilerine erişim yetkiniz bulunmuyor.','Yetki kontrolü: reddedildi'];
  const c=CARDS.filter(x=>x.k==='sahsi');return [`Şahsi kartlarda bu ay toplam ${fmt(c.reduce((a,x)=>a+x.stmt,0))} ödeme var:\n`+c.map(x=>`• ${x.bank} ${x.name} •••• ${x.l4} – ${ds(x.due)} – ${fmt(x.stmt)}`).join('\n'),'Kaynak: Kredi kartı modülü (şahsi)'];
 }
 if(q.includes('kredi kart')||q.includes('şirket')){
  if(role==='sahsi')return ['Şirket verilerine erişim yetkiniz bulunmuyor.','Yetki kontrolü: reddedildi'];
  const c=CARDS.filter(x=>x.k==='ticari');return [`Ticari kartların toplam güncel borcu ${fmt(c.reduce((a,x)=>a+x.debt,0))}; ekstre toplamı ${fmt(c.reduce((a,x)=>a+x.stmt,0))}.`,'Kaynak: Kredi kartı modülü (ticari)'];
 }
 const pr=PRODUCTS.find(p=>q.includes(p.n.split(' ')[0].toLocaleLowerCase('tr')));
 if(pr&&role!=='sahsi')return [`${pr.n}: son alış ${pr.aa} tarihinde ${pr.af}'dan ${pr.aton} ton, ${fmt(pr.afi)}/ton. Son satış ${pr.sa}, ${pr.sf}, ${pr.ston} ton, ${fmt(pr.sfi)}/ton. Son 12 ay satış: ${pr.s12} ton.`,'Kaynak: Logo GO 3 · alış/satış faturaları'];
 if(q.includes('nakit')||q.includes('30 gün')){
  if(role==='sahsi'||role==='muh'||role==='sat')return ['Nakit akışı verilerine erişim yetkiniz bulunmuyor.','Yetki kontrolü: reddedildi'];
  const f=flow(30);return [`30 gün sonu tahmini bakiye ${fmt(f.rows[30].bal)}. ${f.min?`İlk nakit açığı ${ds(f.min.d)} tarihinde, yaklaşık ${fmt(Math.abs(f.min.bal))}.`:'Nakit açığı görünmüyor.'}`,'Kaynak: Nakit akışı motoru (ticari kalemler)'];
 }
 if(q.includes('brüt')&&role!=='sahsi'){const g=PRODUCTS.reduce((a,p)=>a+(p.ws-p.wa)*p.s30,0);return [`Son 30 günde tahmini brüt kâr ${fmt(g)} (ağırlıklı ortalama fiyatlara göre).`,'Kaynak: Logo GO 3 · stok ve fatura hareketleri'];}
 if(q.includes('finansman')&&role!=='sahsi'){const l=LOANS.filter(x=>x.k==='ticari').map(x=>[x.bank,x.inst*x.left-x.principal]).sort((a,b)=>b[1]-a[1]);return [`En yüksek kalan finansman maliyeti ${l[0][0]} bankasında: ${fmt(l[0][1])}.`,'Kaynak: Kredi modülü'];}
 return ['Bu soruyu henüz yanıtlayamıyorum (prototip). Çek, kart, kredi, nakit, ürün veya brüt kâr hakkında sorabilirsiniz.',''];
}
